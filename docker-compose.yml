version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: master_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - etl_network

  mongodb:
    image: mongo:6
    container_name: replica_db
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - ./mongo_data:/data/db
    networks:
      - etl_network

  etl:
    build: .
    container_name: etl_service
    env_file:
      - .env
    volumes:
      - ./last_sync:/app/last_sync
      - ./logs:/app/logs
    depends_on:
      - postgres
      - mongodb
    networks:
      - etl_network
    restart: unless-stopped

networks:
  etl_network:
    driver: bridge

volumes:
  pg_data:
  mongo_data: